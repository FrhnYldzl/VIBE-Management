<style>
/* Juris Kurumsal Kimlik token'ları — Ana Merkez ve panellerle aynı */
:root{--navy:#0A2240;--red:#BC2F2C;--red-ink:#8A1F1D;--bg:#FAFAF7;--bg-elev:#FFFFFF;--bg-sunken:#F3F2EE;--bg-nav:#0A2240;--bg-nav-2:#0E2B50;--border:rgba(10,34,64,.09);--border-strong:rgba(10,34,64,.18);--divider:rgba(10,34,64,.06);--ink:#0A2240;--ink-2:rgba(10,34,64,.72);--ink-3:rgba(10,34,64,.52);--ink-4:rgba(10,34,64,.36);--nav-ink:#FFFFFF;--nav-ink-2:rgba(255,255,255,.72);--nav-ink-3:rgba(255,255,255,.45);--nav-hover:rgba(255,255,255,.07);--nav-active:rgba(255,255,255,.12);--nav-accent:#E26B68;--tint-04:rgba(10,34,64,.04);--tint-08:rgba(10,34,64,.08);--success:#1F7A4E;--success-bg:rgba(31,122,78,.10);--warn:#B4701C;--warn-bg:rgba(180,112,28,.11);--info:#1F5AA8;--info-bg:rgba(31,90,168,.10);--neutral:#5A6B82;--neutral-bg:rgba(90,107,130,.12);--accent-bg:rgba(188,47,44,.10);--track:rgba(10,34,64,.10);--font-display:"Playfair Display","Times New Roman",Georgia,serif;--font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--r-sm:6px;--r-md:10px;--r-lg:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060F1F;--bg-elev:#0D1B33;--bg-sunken:#040A17;--bg-nav:#040A17;--bg-nav-2:#0A1830;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);--divider:rgba(255,255,255,.05);--ink:#F2F0EA;--ink-2:rgba(242,240,234,.72);--ink-3:rgba(242,240,234,.5);--ink-4:rgba(242,240,234,.32);--tint-04:rgba(255,255,255,.03);--tint-08:rgba(255,255,255,.07);--success:#4FB07F;--success-bg:rgba(79,176,127,.14);--warn:#D9984A;--warn-bg:rgba(217,152,74,.14);--info:#6FA0E0;--info-bg:rgba(111,160,224,.14);--neutral:#9AA8BC;--neutral-bg:rgba(154,168,188,.14);--red-ink:#E26B68;--accent-bg:rgba(226,107,104,.14);--track:rgba(255,255,255,.10);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060F1F;--bg-elev:#0D1B33;--bg-sunken:#040A17;--bg-nav:#040A17;--bg-nav-2:#0A1830;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);--divider:rgba(255,255,255,.05);--ink:#F2F0EA;--ink-2:rgba(242,240,234,.72);--ink-3:rgba(242,240,234,.5);--ink-4:rgba(242,240,234,.32);--tint-04:rgba(255,255,255,.03);--tint-08:rgba(255,255,255,.07);--success:#4FB07F;--success-bg:rgba(79,176,127,.14);--warn:#D9984A;--warn-bg:rgba(217,152,74,.14);--info:#6FA0E0;--info-bg:rgba(111,160,224,.14);--neutral:#9AA8BC;--neutral-bg:rgba(154,168,188,.14);--red-ink:#E26B68;--accent-bg:rgba(226,107,104,.14);--track:rgba(255,255,255,.10);color-scheme:dark}
:root[data-theme="dark"] .btn.primary{background:#F2F0EA;color:#0A2240;border-color:#F2F0EA}
.themesw{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--border-strong);border-radius:999px;background:var(--bg-elev)}
.themesw button{width:28px;height:24px;border-radius:999px;display:grid;place-items:center;color:var(--ink-3);background:none;border:0;cursor:pointer}
.themesw button:hover{color:var(--ink)} .themesw button.on{background:var(--ink);color:var(--bg)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}a{color:inherit}
.app{display:flex;height:100%;min-height:100vh}
.nav{width:276px;flex:0 0 276px;background:var(--bg-nav);color:var(--nav-ink);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 14px}.brand .mark{width:36px;height:36px;border-radius:9px;background:var(--red);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;color:#fff}
.brand .name{font-family:var(--font-display);font-size:22px;line-height:1}.brand .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--nav-ink-3);margin-top:4px}
.client{margin:0 14px 6px;padding:12px 14px;border-radius:var(--r-md);background:var(--bg-nav-2);border:1px solid rgba(255,255,255,.08)}.client .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--nav-ink-3)}.client .cname{font-weight:600;font-size:14px;margin-top:3px}.client .ents{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.client .ent{font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--nav-ink-2)}
.navsec{padding:12px 14px 2px}.navsec .h{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--nav-ink-3);padding:0 8px 6px}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:var(--r-sm);color:var(--nav-ink-2);font-size:13px;font-weight:500;text-decoration:none}.ni:hover{background:var(--nav-hover);color:var(--nav-ink)}.ni.active{background:var(--nav-active);color:var(--nav-ink)}
.ni .k{font-family:var(--font-mono);font-size:11px;color:var(--nav-ink-3);width:22px;flex:0 0 22px}.ni.active .k{color:var(--nav-accent)}.ni .t{flex:1}.ni .pct{font-family:var(--font-mono);font-size:11px;color:var(--nav-ink-3)}
.navfoot{margin-top:auto;padding:14px 20px 18px;font-size:11px;color:var(--nav-ink-3);line-height:1.5;border-top:1px solid rgba(255,255,255,.07)}
.main{flex:1;min-width:0;overflow-y:auto;padding:0 24px 48px}.wrap{max-width:1180px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 0 0;min-height:52px}.crumb{font-size:12px;color:var(--ink-3)}.crumb b{color:var(--ink-2);font-weight:500}.spacer{flex:1}.date{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.page-h{padding:22px 0 18px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}.page-h h1{font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em}.page-h .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink);font-weight:600;margin-bottom:6px}.page-h p{margin:8px 0 0;color:var(--ink-2);max-width:66ch}.page-h .right{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);font-size:12.5px;font-weight:600;background:var(--bg-elev);color:var(--ink);text-decoration:none}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:#F2F0EA;color:#0A2240;border-color:#F2F0EA}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.tile{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px 12px}.tile .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}.tile .v{font-family:var(--font-display);font-size:30px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}.tile .v small{font-family:var(--font-body);font-size:13px;color:var(--ink-3);margin-left:4px}.tile .d{font-size:12px;color:var(--ink-3);margin-top:4px}.tile.accent{border-color:transparent;background:var(--navy);color:#fff}.tile.accent .l,.tile.accent .d{color:rgba(255,255,255,.65)}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden;display:flex}.bar i{display:block;height:100%}.tile.accent .bar{background:rgba(255,255,255,.18)}
.sec{margin-top:26px}.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}.sec-h h2{font-family:var(--font-display);font-weight:500;font-size:19px;margin:0}.sec-h .meta{font-size:12px;color:var(--ink-3)}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-lg);min-width:0}.card.pad{padding:16px 18px}
.tbl-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-strong);font-weight:600;white-space:nowrap}td{padding:10px 12px;border-bottom:1px solid var(--divider);vertical-align:top}tr:last-child td{border-bottom:0}
td .no{font-family:var(--font-mono);font-size:11px;color:var(--ink-4);margin-right:6px}td.doc{font-weight:500;min-width:260px}.owner{font-size:12px;color:var(--ink-2);white-space:nowrap}.muted{color:var(--ink-4);font-size:12px}
.status{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.done{background:var(--success-bg);color:var(--success)}.status.progress{background:var(--warn-bg);color:var(--warn)}.status.next{background:var(--info-bg);color:var(--info)}.status.planned{background:var(--neutral-bg);color:var(--neutral)}.status.vision{background:var(--accent-bg);color:var(--red-ink)}
.fnchip{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--tint-08);color:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:10px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-bg);color:var(--ink-2);font-size:13px;margin-top:12px}.note b{color:var(--ink)}
.vis{border-left:3px solid var(--red-ink)}
.scrim{display:none}.menu-btn{display:none;width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--border);align-items:center;justify-content:center}
@media (max-width:900px){.nav{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-100%);transition:transform .2s}.nav.open{transform:none}.scrim{position:fixed;inset:0;background:rgba(4,10,23,.5);z-index:9}.scrim.open{display:block}.menu-btn{display:inline-flex}.main{padding:0 16px 40px}.page-h h1{font-size:24px}}
</style>

<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const titles={roadmap:"Yol Haritası",releases:"Sürümler",feedback:"Geri Bildirim",panels:"Paneller & Senkron",users:"Kullanıcılar",health:"Sağlık",journal:"Journal",maliyet:"Vibe Maliyet"};
let USAGE=null;
const usd=v=>"$"+(+v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const tok=v=>(+v||0)>=1e6?((v/1e6).toFixed(2)+" M"):(+v||0)>=1e3?((v/1e3).toFixed(1)+" K"):String(+v||0);
async function loadUsage(){ try{ USAGE=await fetch("/api/vibe/usage",{credentials:"same-origin"}).then(r=>r.ok?r.json():null); }catch(e){USAGE=null;} const n=document.getElementById("navMaliyet"); if(n&&USAGE) n.innerHTML='<span style="color:'+(USAGE.uyari?"var(--red-ink)":"inherit")+'">'+usd(USAGE.ay.usd)+'</span>'; if(current==="maliyet")render(); }
function viewMaliyet(){ const U=USAGE; if(!U) return '<div class="card pad">Yükleniyor…</div>';
  const B=U.butce, pct=U.oran==null?null:Math.round(U.oran*100), col=pct==null?"var(--neutral)":pct>=100?"var(--red-ink)":U.uyari?"var(--warn)":"var(--success)";
  const TN={quick:"Hızlı",default:"Dengeli",complex:"Derin"};
  const tbl=(rows,label)=>rows.length?'<div class="card"><div class="tbl-wrap"><table><thead><tr><th>'+label+'</th><th style="text-align:right">İstek</th><th style="text-align:right">Girdi</th><th style="text-align:right">Çıktı</th><th style="text-align:right">Maliyet</th><th style="width:30%"></th></tr></thead><tbody>'+rows.map(r=>'<tr><td class="doc">'+esc((label==="Kademe"?TN[r.k]||r.k:r.k)||"—")+'</td><td style="text-align:right">'+r.istek+'</td><td style="text-align:right">'+tok(r.input)+'</td><td style="text-align:right">'+tok(r.output)+'</td><td style="text-align:right"><b>'+usd(r.usd)+'</b></td><td><div class="bar"><i style="width:'+(U.ay.usd?Math.round(r.usd/U.ay.usd*100):0)+'%;background:var(--navy)"></i></div></td></tr>').join("")+'</tbody></table></div></div>':'<div class="card pad muted">Bu ay kayıt yok.</div>';
  const maxD=Math.max(0.01,...U.gunluk.map(g=>g.usd));
  return '<div class="page-h"><div><div class="eyebrow">Veri ve sistem · A7</div><h1>Vibe Maliyet</h1><p>Her Claude isteği model, token ve tahmini maliyetle kaydedilir. Aylık tavan dolunca yeni istek durur (402); uyarı eşiğinde Vibe üst çubuğu ve bu sayfa uyarır. Fiyatlar: <a href="'+esc(U.fiyatKaynak.url)+'" target="_blank" rel="noopener">resmi tarife</a> · '+esc(U.fiyatKaynak.okundu)+' tarihinde okundu.'+(U.anahtar?"":' <b style="color:var(--red-ink)">ANTHROPIC_API_KEY tanımlı değil.</b>')+'</p></div></div>'
   +'<div class="tiles"><div class="tile accent"><div class="l">Bu ay harcanan</div><div class="v">'+usd(U.ay.usd)+'</div><div class="d">tavan '+(B.aylikUsd?usd(B.aylikUsd):"yok")+' · '+(pct==null?"—":"%"+pct)+'</div><div class="bar" style="margin-top:8px"><i style="width:'+Math.min(100,pct||0)+'%;background:'+col+'"></i></div></div>'
   +'<div class="tile"><div class="l">Kalan</div><div class="v">'+(B.aylikUsd?usd(Math.max(0,B.aylikUsd-U.ay.usd)):"—")+'</div><div class="d">uyarı eşiği %'+B.uyariYuzde+'</div></div>'
   +'<div class="tile"><div class="l">İstek</div><div class="v">'+U.ay.istek+'</div><div class="d">ortalama '+usd(U.ay.istek?U.ay.usd/U.ay.istek:0)+' / istek</div></div>'
   +'<div class="tile"><div class="l">Token</div><div class="v" style="font-size:20px">'+tok(U.ay.input)+' / '+tok(U.ay.output)+'</div><div class="d">girdi / çıktı · önbellek '+tok(U.ay.cache_read)+'</div></div></div>'
   +(U.uyari?'<div class="note"><span>▲</span><div><b>Uyarı eşiği aşıldı:</b> bu ay '+usd(U.ay.usd)+' harcandı ('+(pct??"—")+'%). Gerekirse tavanı artırın ya da "Derin" kademeyi kapatın.</div></div>':"")
   +'<div class="sec"><div class="sec-h"><h2>Bütçe ve kademeler</h2><span class="meta">'+(U.butceGuncelleme?"son değişiklik "+fmtD2(U.butceGuncelleme.updated_at)+" · "+esc(U.butceGuncelleme.updated_by):"varsayılan ayarlar")+'</span></div><div class="card pad"><form id="budgetForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end">'

/* A3 · Paneller & Senkron — Intake-lite (v0.5.1) */
function viewPanels(){
  const st=INTAKE||{hazir:false,serviceAccount:null,adimlar:[]}; const ps=PANELS||[];
  const sm=p=>p.smoke?`${p.smoke.views} görünüm · ${p.smoke.items} başlık · ${p.smoke.docs} doküman`:"—";
  return `<div class="page-h"><div><div class="eyebrow">Veri ve sistem · A3</div><h1>Paneller &amp; Senkron</h1><p><b>Intake-lite:</b> Drive Data Room linki + müvekkil adı → tarama → standart veri taslağı → panel. Üretilen panel Ana Merkez'de <b>Kurumsal Yönetim Panelleri</b> altında kart olur; metinleri Juris doldurur.</p></div></div>
  <div class="tiles"><div class="tile accent"><div class="l">Drive bağlantısı</div><div class="v" style="font-size:20px">${st.hazir?"Hazır":"Kurulmadı"}</div><div class="d" style="color:rgba(255,255,255,.65)">${st.serviceAccount?esc(st.serviceAccount):"GOOGLE_SERVICE_ACCOUNT_JSON yok"}</div></div>
  <div class="tile"><div class="l">Intake panelleri</div><div class="v">${ps.length}</div><div class="d">+ 5 el yapımı panel (kit)</div></div>
  <div class="tile"><div class="l">Son tarama</div><div class="v" style="font-size:20px">${ps.length?fmtD2(ps.map(p=>p.scanned_at).sort().pop()):"—"}</div><div class="d">yeniden tarama panel satırından</div></div></div>
  ${!st.hazir?`<div class="note"><span>▲</span><div><b>Kurulum gerekli:</b> ${st.adimlar.map(esc).join(" · ")}. Adımlar: <code>docs/ops/RAILWAY.md → Google service account</code>.</div></div>`:""}
  <div class="sec"><div class="sec-h"><h2>Yeni panel</h2><span class="meta">Drive linki + müvekkil adı</span></div><div class="card pad">
   <form id="intakeForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;align-items:end">
    <label style="font-size:12px;color:var(--ink-3)">Müvekkil adı<input name="name" required placeholder="Örn. Çağrı Teknoloji A.Ş." style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--paper)"></label>
    <label style="font-size:12px;color:var(--ink-3)">Kısa ad (panel anahtarı)<input name="short" placeholder="Örn. Çağrı" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--paper)"></label>
    <label style="font-size:12px;color:var(--ink-3);grid-column:1/-1">Drive Data Room kök klasörü (A–F klasörlerini içeren)<input name="driveRoot" required type="url" placeholder="https://drive.google.com/drive/folders/…" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--paper)"></label>
    <label style="font-size:12px;color:var(--ink-3)">Tüzel kişilikler (virgülle, isteğe bağlı)<input name="entities" placeholder="Örn. X A.Ş., Y Ltd. Şti." style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--paper)"></label>
    <label style="font-size:12px;color:var(--ink-3)">Hizmet başlangıcı (isteğe bağlı)<input name="kickoff" placeholder="2026-11-01" style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--paper)"></label>
    <div><button class="btn primary" type="submit" ${st.hazir?"":"disabled"} id="intakeGo">Tara ve paneli üret</button></div>
   </form><div id="intakeOut" class="muted" style="margin-top:10px;font-size:12.5px"></div>
   <div class="muted" style="margin-top:8px;font-size:12px">Klasör, service account e-postasıyla <b>Görüntüleyen</b> olarak paylaşılmış olmalı. Tarama: bölüm klasörleri (A–F) → alt başlıklar → dosyalar (bir seviye derin). Dosyalar panelde "Onay Bekliyor" doküman satırı olur.</div></div></div>
  ${viewSkor(ps)}
  ${viewDogrulama(ps)}
  <div class="sec"><div class="sec-h"><h2>Intake panelleri</h2><span class="meta">kaynak: veritabanı + Volume/panels</span></div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>Panel</th><th>Tüzel kişilik</th><th>Drive</th><th>Smoke</th><th>Tarama</th><th>Durum</th><th></th></tr></thead><tbody>
  ${ps.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted" style="font-size:11px;font-family:var(--font-mono)">${esc(p.slug)}</div></td><td style="color:var(--ink-2)">${esc(p.entities.join(" · "))}</td><td class="owner">${p.files} dosya · ${p.folders} alt klasör · <a href="${esc(p.drive_root)}" target="_blank" rel="noopener">klasör ↗</a></td><td class="owner">${sm(p)}</td><td class="owner">${fmtD2(p.scanned_at)}<div class="muted" style="font-size:11px">${esc(p.created_by)}</div></td><td><span class="status ${p.status==="ok"?"done":p.status==="warn"?"input":"pending"}">${p.status==="ok"?"Hazır":p.status==="warn"?"Data Room boş":"Hata"}</span>${p.error?`<div class="muted" style="font-size:11px;max-width:260px">${esc(p.error)}</div>`:""}</td><td style="white-space:nowrap"><a class="btn" href="/app/#p-${esc(p.slug)}" target="_blank" rel="noopener">Aç</a> <button class="btn" data-rescan="${esc(p.slug)}">Yeniden tara</button> <button class="btn" data-pdel="${esc(p.slug)}">Sil</button></td></tr>`).join("")}
  ${!ps.length?`<tr><td colspan="7" class="muted">Henüz Intake-lite paneli yok. Onscala · Codemag · Zyrone · Qervan–WeTrade · Meown AI el yapımıdır (packages/juris-panel-kit).</td></tr>`:""}
  </tbody></table></div></div></div>`;
}
async function loadPanels(){ try{ [INTAKE,PANELS,DOGR,SCORES]=await Promise.all([fetch("/api/intake/status",{credentials:"same-origin"}).then(r=>r.ok?r.json():null),fetch("/api/panels",{credentials:"same-origin"}).then(r=>r.ok?r.json():[]),fetch("/api/vibe/state",{credentials:"same-origin"}).then(r=>r.ok?r.json():{}).then(s=>(s.dogrulama&&s.dogrulama.value)||[]),fetch("/api/panels/scores",{credentials:"same-origin"}).then(r=>r.ok?r.json():{})]); $("#navPanelCnt").textContent=PANELS?String(5+PANELS.length):""; }catch(e){} if(current==="panels")render(); }
/* Kurumsal Yönetim Skoru (v0.5.6): paneller hesaplar (KYS v1), sunucu son anlık görüntüyü tutar; panel açılınca güncellenir */
function viewSkor(ps){
  const rows=KIT_PANELS.concat((ps||[]).map(p=>[p.slug,p.name+" (intake)"])); const S=SCORES||{};
  const col=t=>t>=80?"var(--success)":t>=65?"var(--info)":t>=50?"var(--warn)":"var(--red-ink)";
  const have=rows.filter(([p])=>S[p]); const avg=have.length?Math.round(have.reduce((a,[p])=>a+S[p].toplam,0)/have.length):null;
  const krit=(have[0]&&S[have[0][0]].kriterler)||[];
  return `<div class="sec"><div class="sec-h"><h2>Kurumsal Yönetim Skoru</h2><span class="meta">KYS v1 · 7 kriter, ağırlıklı 0–100 · A ≥80 Olgun · B ≥65 İyi · C ≥50 Gelişen · D ≥35 Başlangıç · E Kritik · panel açıldığında yeniden hesaplanır${avg!==null?` · <b>portföy ortalaması ${avg}</b>`:""}</span></div>
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Panel</th><th style="text-align:right">Skor</th><th>Seviye</th>${krit.map(k=>`<th style="text-align:center;font-size:10.5px" title="${esc(k.t)} · ağırlık %${k.w}">${esc(k.t.split(" ")[0])}<br><span style="font-weight:400">%${k.w}</span></th>`).join("")}<th>Güncelleme</th></tr></thead><tbody>
  ${rows.map(([p,n])=>{const s=S[p]; if(!s) return `<tr><td><b>${esc(n)}</b></td><td colspan="${3+krit.length}" class="muted" style="font-size:12px">Henüz hesaplanmadı — paneli bir kez açın (Ana Merkez → ${esc(n)}).</td></tr>`;
    return `<tr><td><b>${esc(n)}</b></td><td style="text-align:right;font-family:var(--font-display);font-size:22px;color:${col(s.toplam)}">${s.toplam}</td><td><span class="pill" style="background:${col(s.toplam)};color:#fff">${esc(s.harf)} · ${esc(s.seviye)}</span></td>${(s.kriterler||[]).map(k=>`<td style="text-align:center" title="${esc(k.not||"")}"><div style="font-family:var(--font-mono);font-size:12px;color:${col(k.puan)}">${k.puan}</div><div class="bar" style="height:4px;margin-top:3px"><i style="width:${k.puan}%;background:${col(k.puan)};display:block;height:100%"></i></div></td>`).join("")}<td class="owner">${fmtD2(s.updated_at)}<div class="muted" style="font-size:11px">${esc(s.updated_by||"")} · veri ${esc(s.veriTarihi||"")}</div></td></tr>`;}).join("")}
  </tbody></table></div></div>
  <div class="note" style="margin-top:10px"><span>ℹ</span><div><b>Kriterler (v1):</b> Dokümantasyon %25 · Dayanak kalitesi %10 · Yönetişim ritmi (90 günde tutanaklı toplantı) %15 · Karar ve aksiyon disiplini %15 · KPI/OKR ilerlemesi %15 · DD %12 · Risk yönetimi %8. Resmi skorlama geldiğinde kriter seti ve ağırlıklar panel master'ındaki <code>KYS.kriterler</code>'den tek yerde değişir; geçmiş anlık görüntüler sürüm etiketiyle ayrışır.</div></div></div>`;
}
/* Doğrulama turu (v0.5.5): panel × kontrol — iki kullanıcıda ortak (vibe_state: dogrulama) */
const KIT_PANELS=[["onscala","Onscala"],["codemag","Codemag"],["zyrone","Zyrone"],["qervan-wetrade","Qervan–WeTrade","qervan"],["meown","Meown AI"],["juris","Juris · portföy"],["fevup","Fevup Brands · portföy"],["marqby","Marqby · portföy"],["d2x","D2-X · portföy"],["meridyen","Meridyen · portföy"]]; /* [CLIENT.id, ad, Ana Merkez görünüm anahtarı] */
const panelView=p=>p[2]||p[0];
const CHECKS=[["kunye","Künye & kişiler"],["links","Data Room linkleri"],["okr","OKR hedefleri"],["fin","Finans (B)"],["dd","DD checklist (E-1)"],["risk","Riskler"],["proc","Toplantı & aksiyon"],["tarih","Veri tarihi"]];
function viewDogrulama(ps){
  const rows=KIT_PANELS.concat((ps||[]).map(p=>[p.slug,p.name+" (intake)"])); const d=DOGR||[]; const ok=(p,c)=>d.find(x=>x.panel===p&&x.check===c&&x.ok);
  const tot=rows.length*CHECKS.length, done=rows.reduce((a,[p])=>a+CHECKS.filter(([c])=>ok(p,c)).length,0);
  return `<div class="sec"><div class="sec-h"><h2>Doğrulama turu</h2><span class="meta">Gülşah ile panel panel: hücreye tıkla → doğrulandı (kim · ne zaman). Toplam ${done}/${tot} · %${tot?Math.round(done/tot*100):0}</span></div>
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Panel</th>${CHECKS.map(([,t])=>`<th style="text-align:center;font-size:10.5px">${esc(t)}</th>`).join("")}<th style="text-align:right">%</th></tr></thead><tbody>
  ${rows.map((row)=>{const [p,n]=row;const k=CHECKS.filter(([c])=>ok(p,c)).length;return `<tr><td><b>${esc(n)}</b> <a class="btn" style="height:22px;padding:0 8px;font-size:11px;margin-left:6px" href="/app/#p-${esc(panelView(row))}" target="_blank" rel="noopener">aç</a></td>${CHECKS.map(([c])=>{const r=ok(p,c);return `<td style="text-align:center"><button class="status ${r?"done":"pending"}" data-dogr="${p}:${c}" title="${r?esc((r.by||"")+" · "+(r.date||"").slice(0,10)):"doğrula"}" style="cursor:pointer;min-width:34px">${r?"✓":"·"}</button></td>`;}).join("")}<td style="text-align:right;font-family:var(--font-mono)">${Math.round(k/CHECKS.length*100)}</td></tr>`;}).join("")}
  </tbody></table></div></div></div>`;
}
async function toggleDogr(key){ const [panel,check]=key.split(":"); DOGR=DOGR||[]; const i=DOGR.findIndex(x=>x.panel===panel&&x.check===check);
  if(i>=0) DOGR.splice(i,1); else DOGR.push({panel,check,ok:true,by:(ME&&ME.name)||"",date:new Date().toISOString()});
  render(); await fetch("/api/vibe/state/dogrulama",{method:"PUT",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(DOGR)}); }
async function runIntake(form){
  const fd=new FormData(form); const body={name:fd.get("name"),driveRoot:fd.get("driveRoot")};
  if(fd.get("short"))body.short=fd.get("short"); if(fd.get("kickoff"))body.kickoff=fd.get("kickoff");
  const ents=String(fd.get("entities")||"").split(",").map(s=>s.trim()).filter(Boolean); if(ents.length)body.entities=ents;
  const out=$("#intakeOut"), btn=$("#intakeGo"); btn.disabled=true; out.textContent="Drive taranıyor ve panel üretiliyor… (10–60 sn)";
  try{ const r=await fetch("/api/intake",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(body)}); const j=await r.json();
    if(!r.ok){ out.innerHTML=`<span style="color:var(--red-ink)">Olmadı:</span> ${esc(j.hata||r.status)}${j.ayrinti?" · "+esc(JSON.stringify(j.ayrinti)):""}`; btn.disabled=false; return; }
    out.innerHTML=`<b>${esc(j.name)}</b> üretildi · ${j.files} dosya / ${j.folders} alt klasör · ${j.bolumler.map(b=>esc(b.baslik.split(".")[0])+":"+b.dosya).join(" · ")} · <a href="/app/#p-${esc(j.slug)}" target="_blank" rel="noopener">Ana Merkez'de aç ↗</a>`;
    form.reset(); loadPanels();
  }catch(e){ out.textContent="Bağlantı hatası: "+e.message; btn.disabled=false; }
}
async function rescanPanel(slug){ const r=await fetch("/api/panels/"+encodeURIComponent(slug)+"/rescan",{method:"POST",credentials:"same-origin"}); if(!r.ok)alert("Olmadı: "+(await r.text())); loadPanels(); }
async function deletePanel(slug){ if(!confirm(slug+" paneli silinsin mi? (Drive'daki dosyalara dokunulmaz; paneldeki durum işaretleri kalır)"))return; const r=await fetch("/api/panels/"+encodeURIComponent(slug),{method:"DELETE",credentials:"same-origin"}); if(!r.ok)alert("Olmadı: "+(await r.text())); loadPanels(); }
function placeholder(k,ver,desc){return `<div class="page-h"><div><div class="eyebrow">${esc(k)}</div><h1>${esc(titles[current])}</h1><p>${esc(desc)}</p></div></div><div class="card pad" style="color:var(--ink-3)">Bu görünüm <b style="color:var(--ink)">${esc(ver)}</b> sürümünde gelir. Kapsam: Yol Haritası → v1.0.</div>`;}
function render(){
  const el=$("#view"); $("#crumb").textContent=titles[current]; document.querySelectorAll(".ni[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===current));
  if(!RM){el.innerHTML='<div class="card pad">Yükleniyor…</div>';return;}
  el.innerHTML=current==="maliyet"?viewMaliyet():current==="journal"?viewJournal():current==="roadmap"?viewRoadmap():current==="releases"?viewReleases():current==="health"?viewHealth():current==="feedback"?placeholder("Ürün yönetimi · A2","v0.6.1","Uygulama içi geri bildirim gelen kutusu ve triage (şimdi / sonraki / fikir / ret)."):current==="panels"?viewPanels():viewUsers();
  $("#main").scrollTop=0; $("#nav").classList.remove("open"); $("#scrim").classList.remove("open");
}
document.addEventListener("click",e=>{const b=e.target.closest(".ni[data-view]");if(b){current=b.dataset.view;location.hash=current;render();return;}
  const r=e.target.closest("[data-reset]"); if(r){resetPassword(r.dataset.reset);return;} if(e.target.closest("#uAdd")){addUser();return;}
  const rs=e.target.closest("[data-rescan]"); if(rs){rs.disabled=true;rs.textContent="Taranıyor…";rescanPanel(rs.dataset.rescan);return;}
  const pd=e.target.closest("[data-pdel]"); if(pd){deletePanel(pd.dataset.pdel);return;}
  const dg=e.target.closest("[data-dogr]"); if(dg){toggleDogr(dg.dataset.dogr);return;}
  if(e.target.closest("#jRun")){ const b=e.target.closest("#jRun"); b.disabled=true; b.textContent="Çalışıyor…"; fetch("/api/journal/run",{method:"POST",credentials:"same-origin"}).then(()=>loadJournal()); return; }
  const dk=e.target.closest("[data-dikey]"); if(dk){e.preventDefault(); DIKEY=dk.dataset.dikey&&DIKEY!==dk.dataset.dikey?dk.dataset.dikey:null; const y=$("#main").scrollTop; render(); $("#main").scrollTop=y; return;} });
document.addEventListener("submit",e=>{ if(e.target.id==="intakeForm"){e.preventDefault();runIntake(e.target);} if(e.target.id==="budgetForm"){ e.preventDefault(); const f=e.target; const body={aylikUsd:+f.aylikUsd.value,uyariYuzde:+f.uyariYuzde.value,tierMax:{quick:+f.max_quick.value,default:+f.max_default.value,complex:+f.max_complex.value},kapali:["quick","default","complex"].filter(k=>!f["acik_"+k].checked)};
  fetch("/api/vibe/budget",{method:"PUT",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(body)}).then(async r=>{ if(!r.ok) alert("Kaydedilemedi: "+(await r.text())); loadUsage(); }); } });
$("#menuBtn").addEventListener("click",()=>{$("#nav").classList.toggle("open");$("#scrim").classList.toggle("open");});$("#scrim").addEventListener("click",()=>{$("#nav").classList.remove("open");$("#scrim").classList.remove("open");});
current=titles[location.hash.slice(1)]?location.hash.slice(1):"roadmap"; render();
Promise.all([fetch("/api/roadmap").then(r=>r.json()),fetch("/api/releases").then(r=>r.json()),fetch("/api/health").then(r=>r.json()).catch(()=>null),fetch("/api/me").then(r=>r.json()).catch(()=>null),fetch("/api/auth/config").then(r=>r.json()).catch(()=>null)]).then(([rm,rel,h,me,ac])=>{RM=rm;REL=rel;HEALTH=h;ME=me;AUTHCFG=ac;$("#ver").textContent="v"+(h?.surum||rel.guncel);$("#vibeState").textContent="Vibe: "+(h?.vibe?"açık":"kapalı");$("#rmPct").textContent=stats(rm.surumler[0].adimlar).pct+"%";if(me&&!ac?.disabled){$("#who").textContent=me.name;$("#who").hidden=false;$("#logout").hidden=false;}render();loadUsers();loadPanels();loadJournal();loadUsage();});

/* v0.6.6 tema tercihi: Açık · Sistem · Koyu — localStorage "mtfg-theme"; panel iframe'leri data-theme gözlemcisiyle eşitlenir */
function applyTheme(t){ const r=document.documentElement; if(t==="light"||t==="dark") r.setAttribute("data-theme",t); else { r.removeAttribute("data-theme"); t="system"; }
  try{ localStorage.setItem("mtfg-theme",t); }catch(e){}
  document.querySelectorAll("[data-theme-set]").forEach(b=>{ const on=b.dataset.themeSet===t; b.classList.toggle("on",on); b.setAttribute("aria-checked",String(on)); }); }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-theme-set]"); if(b) applyTheme(b.dataset.themeSet); });
(()=>{ let t="system"; try{ t=localStorage.getItem("mtfg-theme")||"system"; }catch(e){} applyTheme(t); })();
</script>
</body>
