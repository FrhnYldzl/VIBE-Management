<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hesap · VIBE Management</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--navy:#0A2240;--red:#BC2F2C;--red-ink:#8A1F1D;--bg:#FAFAF7;--bg-elev:#FFFFFF;--border:rgba(10,34,64,.09);--border-strong:rgba(10,34,64,.18);--ink:#0A2240;--ink-2:rgba(10,34,64,.72);--ink-3:rgba(10,34,64,.52);--accent-bg:rgba(188,47,44,.10);--success:#1F7A4E;--success-bg:rgba(31,122,78,.10);--font-display:"Playfair Display","Times New Roman",Georgia,serif;--font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--r-sm:6px;--r-lg:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060F1F;--bg-elev:#0D1B33;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);--ink:#F2F0EA;--ink-2:rgba(242,240,234,.72);--ink-3:rgba(242,240,234,.5);--red-ink:#E26B68;--accent-bg:rgba(226,107,104,.14);--success:#4FB07F;--success-bg:rgba(79,176,127,.14);--navy:#F2F0EA;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border)}
.mark{width:32px;height:32px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;color:#fff}
.name{font-family:var(--font-display);font-size:18px;line-height:1}
header nav{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--border-strong);font:inherit;font-weight:600;font-size:13px;background:var(--bg-elev);color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--bg)}
main{flex:1;display:flex;justify-content:center;padding:40px 20px}
.card{width:min(460px,100%);background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;height:fit-content}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink);font-weight:600;margin-bottom:6px}
h1{font-family:var(--font-display);font-weight:500;font-size:26px;margin:0 0 6px}.lead{color:var(--ink-2);margin:0 0 18px;font-size:13.5px}
dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px;margin:0 0 18px}dt{color:var(--ink-3)}dd{margin:0}.mono{font-family:var(--font-mono);font-size:12px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:10px 0 5px}
input{width:100%;height:38px;padding:0 11px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--red);outline-offset:1px}
form .btn{margin-top:14px;width:100%}
.msg{margin:0 0 12px;padding:10px 12px;border-radius:var(--r-sm);font-size:13px}.msg.err{background:var(--accent-bg);color:var(--red-ink)}.msg.ok{background:var(--success-bg);color:var(--success)}
.hint{font-size:12px;color:var(--ink-3);margin-top:12px}
</style>
</head>
<body>
<header><div class="mark">M</div><div class="name">VIBE Management</div><nav><a class="btn" href="/app/">Ana Merkez</a><a class="btn" href="/admin/">Admin</a><a class="btn" href="/auth/logout">Çıkış</a></nav></header>
<main>
  <div class="card">
    <div class="eyebrow">Hesap</div>
    <h1>{{NAME}}</h1>
    <p class="lead">Oturum ve parola ayarları.</p>
    {{MSG}}
    <dl><dt>E-posta</dt><dd class="mono">{{EMAIL}}</dd><dt>Giriş yolu</dt><dd>{{VIA}}</dd><dt>Parola değişti</dt><dd>{{CHANGED}}</dd></dl>
    <form method="post" action="/hesap/parola">
      <label for="c">Mevcut parola</label><input id="c" name="current" type="password" autocomplete="current-password" required>
      <label for="n">Yeni parola</label><input id="n" name="next" type="password" autocomplete="new-password" minlength="10" required placeholder="en az 10 karakter">
      <label for="n2">Yeni parola (tekrar)</label><input id="n2" name="next2" type="password" autocomplete="new-password" minlength="10" required>
      <button class="btn primary" type="submit">Parolayı değiştir</button>
    </form>
    <div class="hint">Parola veritabanında saklanır (scrypt). Unutursanız diğer kullanıcı Admin → Kullanıcılar'dan sıfırlayabilir.</div>
  </div>
</main>
</body>
</html>
