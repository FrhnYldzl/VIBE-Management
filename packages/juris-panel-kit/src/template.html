<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Juris Kurumsal Yönetim Paneli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy brand rail (left) + paper workspace. Juris Kurumsal Kimlik tokens: Pantone 289C navy, 7620C red. */
:root{
  --navy:#0A2240; --red:#BC2F2C; --red-ink:#8A1F1D;
  --bg:#FAFAF7; --bg-elev:#FFFFFF; --bg-sunken:#F3F2EE; --bg-nav:#0A2240; --bg-nav-2:#0E2B50;
  --border:rgba(10,34,64,.09); --border-strong:rgba(10,34,64,.18); --divider:rgba(10,34,64,.06);
  --ink:#0A2240; --ink-2:rgba(10,34,64,.72); --ink-3:rgba(10,34,64,.52); --ink-4:rgba(10,34,64,.36);
  --nav-ink:#FFFFFF; --nav-ink-2:rgba(255,255,255,.72); --nav-ink-3:rgba(255,255,255,.45); --nav-hover:rgba(255,255,255,.07); --nav-active:rgba(255,255,255,.12); --nav-accent:#E26B68;
  --tint-04:rgba(10,34,64,.04); --tint-08:rgba(10,34,64,.08); --tint-12:rgba(10,34,64,.12);
  --success:#1F7A4E; --success-bg:rgba(31,122,78,.10); --warn:#B4701C; --warn-bg:rgba(180,112,28,.11); --info:#1F5AA8; --info-bg:rgba(31,90,168,.10); --neutral:#5A6B82; --neutral-bg:rgba(90,107,130,.12); --accent-bg:rgba(188,47,44,.10);
  --track:rgba(10,34,64,.10); --chart-1:#0A2240; --chart-2:#BC2F2C; --chart-3:#1F5AA8; --chart-4:#B4701C; --chart-ghost:rgba(10,34,64,.18);
  --font-display:"Playfair Display","Times New Roman",Georgia,serif;
  --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --shadow-sm:0 1px 2px rgba(10,34,64,.05),0 1px 1px rgba(10,34,64,.03);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#060F1F; --bg-elev:#0D1B33; --bg-sunken:#040A17; --bg-nav:#040A17; --bg-nav-2:#0A1830;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16); --divider:rgba(255,255,255,.05);
  --ink:#F2F0EA; --ink-2:rgba(242,240,234,.72); --ink-3:rgba(242,240,234,.5); --ink-4:rgba(242,240,234,.32);
  --tint-04:rgba(255,255,255,.03); --tint-08:rgba(255,255,255,.07); --tint-12:rgba(255,255,255,.10);
  --success:#4FB07F; --success-bg:rgba(79,176,127,.14); --warn:#D9984A; --warn-bg:rgba(217,152,74,.14); --info:#6FA0E0; --info-bg:rgba(111,160,224,.14); --neutral:#9AA8BC; --neutral-bg:rgba(154,168,188,.14); --red-ink:#E26B68; --accent-bg:rgba(226,107,104,.14);
  --track:rgba(255,255,255,.10); --chart-1:#8FB0E0; --chart-2:#E26B68; --chart-3:#6FA0E0; --chart-4:#D9984A; --chart-ghost:rgba(255,255,255,.2);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#060F1F; --bg-elev:#0D1B33; --bg-sunken:#040A17; --bg-nav:#040A17; --bg-nav-2:#0A1830;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16); --divider:rgba(255,255,255,.05);
  --ink:#F2F0EA; --ink-2:rgba(242,240,234,.72); --ink-3:rgba(242,240,234,.5); --ink-4:rgba(242,240,234,.32);
  --tint-04:rgba(255,255,255,.03); --tint-08:rgba(255,255,255,.07); --tint-12:rgba(255,255,255,.10);
  --success:#4FB07F; --success-bg:rgba(79,176,127,.14); --warn:#D9984A; --warn-bg:rgba(217,152,74,.14); --info:#6FA0E0; --info-bg:rgba(111,160,224,.14); --neutral:#9AA8BC; --neutral-bg:rgba(154,168,188,.14); --red-ink:#E26B68; --accent-bg:rgba(226,107,104,.14);
  --track:rgba(255,255,255,.10); --chart-1:#8FB0E0; --chart-2:#E26B68; --chart-3:#6FA0E0; --chart-4:#D9984A; --chart-ghost:rgba(255,255,255,.2);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* shell */
.app{display:flex;height:100%;min-height:100vh}
.nav{width:276px;flex:0 0 276px;background:var(--bg-nav);color:var(--nav-ink);display:flex;flex-direction:column;padding-left:max(0px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 14px}
.brand .name{font-family:var(--font-display);font-size:22px;line-height:1}
.brand .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--nav-ink-3);margin-top:4px}
.client{margin:0 14px 6px;padding:12px 14px;border-radius:var(--r-md);background:var(--bg-nav-2);border:1px solid rgba(255,255,255,.08)}
.client .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--nav-ink-3)}
.client .cname{font-weight:600;font-size:14px;margin-top:3px;line-height:1.3}
.client .ents{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.client .ent{font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--nav-ink-2)}
.navsec{padding:12px 14px 2px}
.navsec .h{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--nav-ink-3);padding:0 8px 6px;display:flex;justify-content:space-between}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:var(--r-sm);color:var(--nav-ink-2);font-size:13px;font-weight:500}
.ni:hover{background:var(--nav-hover);color:var(--nav-ink)}
.ni.active{background:var(--nav-active);color:var(--nav-ink)}
.ni .k{font-family:var(--font-mono);font-size:11px;color:var(--nav-ink-3);width:22px;flex:0 0 22px}
.ni.active .k{color:var(--nav-accent)}
.ni .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .pct{font-family:var(--font-mono);font-size:11px;color:var(--nav-ink-3)}
.ni .chev{width:14px;height:14px;transition:transform .15s;color:var(--nav-ink-3)}
.ni[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sub-list{display:none;flex-direction:column;gap:1px;padding:2px 0 4px}
.sub-list.open{display:flex}
.ni.sub{padding:5px 10px 5px 42px;font-size:12.5px;font-weight:400}
.ni.sub .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.navfoot{margin-top:auto;padding:14px 20px 18px;font-size:11px;color:var(--nav-ink-3);line-height:1.5;border-top:1px solid rgba(255,255,255,.07)}

.main{flex:1;min-width:0;overflow-y:auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 0;min-height:52px}
.crumb{font-size:12px;color:var(--ink-3)} .crumb b{color:var(--ink-2);font-weight:500}
.topbar .spacer{flex:1}
.date{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.menu-btn{display:none;width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--border);align-items:center;justify-content:center}
.wrap{max-width:1180px;margin:0 auto}
.page-h{padding:22px 0 18px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.page-h h1{font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.page-h .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink);font-weight:600;margin-bottom:6px}
.page-h p{margin:8px 0 0;color:var(--ink-2);max-width:62ch}
.page-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);font-size:12.5px;font-weight:600;background:var(--bg-elev);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--tint-04);border-color:var(--border-strong)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{background:#F2F0EA;color:#0A2240;border-color:#F2F0EA}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{background:#F2F0EA;color:#0A2240;border-color:#F2F0EA}}

/* tiles / bars */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.tile{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px 12px;min-width:0}
.tile .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tile .v{font-family:var(--font-display);font-size:30px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .v small{font-family:var(--font-body);font-size:13px;color:var(--ink-3);margin-left:4px}
.tile .d{font-size:12px;color:var(--ink-3);margin-top:4px}
.tile.accent{border-color:transparent;background:var(--navy);color:#fff}
.tile.accent .l,.tile.accent .d{color:rgba(255,255,255,.65)}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .s-done{background:var(--success)} .bar .s-review{background:var(--info)} .bar .s-progress{background:var(--warn)} .bar .s-input{background:var(--red-ink)}
.tile.accent .bar{background:rgba(255,255,255,.18)}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--font-display);font-weight:500;font-size:19px;margin:0}
.sec-h .meta{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-lg);min-width:0}
.card.pad{padding:16px 18px}
.area{display:flex;flex-direction:column;gap:10px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;border-radius:var(--r-lg)}
.area:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.area .top{display:flex;align-items:center;gap:10px}
.area .code{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);background:var(--tint-08);padding:2px 6px;border-radius:4px}
.area .ttl{font-weight:600;font-size:14px;flex:1;min-width:0}
.area .pct{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.area .foot{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
.fnchip{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--tint-08);color:var(--ink-2)}
.fnchip.PLAN{background:var(--info-bg);color:var(--info)} .fnchip.İCRA{background:var(--warn-bg);color:var(--warn)} .fnchip.DENETİM{background:var(--accent-bg);color:var(--red-ink)} .fnchip.RAPORLAMA{background:var(--success-bg);color:var(--success)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-strong);font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--divider);vertical-align:top}
tr:last-child td{border-bottom:0}
td.doc{font-weight:500;min-width:220px}
td.doc .ent{display:inline-block;font-size:10.5px;color:var(--ink-3);margin-left:6px;font-weight:400}
td .no{font-family:var(--font-mono);font-size:11px;color:var(--ink-4);margin-right:6px}
.owner{font-size:12px;color:var(--ink-2);white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.done{background:var(--success-bg);color:var(--success)} .status.review{background:var(--info-bg);color:var(--info)} .status.progress{background:var(--warn-bg);color:var(--warn)} .status.input{background:var(--accent-bg);color:var(--red-ink)} .status.pending{background:var(--neutral-bg);color:var(--neutral)}
button.status:hover{border-color:currentColor}
.linkbtn{font-size:12px;color:var(--info);text-decoration:none;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.muted{color:var(--ink-4);font-size:12px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-bg);color:var(--ink-2);font-size:13px;margin-top:12px}
/* Süreç Kaydı (v0.5.5): kullanıcı eklemeleri ve doküman notları */
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:12px 14px;border-top:1px solid var(--divider);align-items:end}
.pform input,.pform select{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;font:inherit;font-size:12.5px;background:var(--bg);color:var(--ink)}
.pform label{font-size:11px;color:var(--ink-3);display:block}
.pform .btn{height:32px;justify-content:center}
.ek{font-family:var(--font-mono);font-size:10px;color:var(--info);background:var(--info-bg);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.docnote{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3);font-style:italic}
.pill.green{background:var(--success-bg);color:var(--success)} .pill.amber{background:var(--warn-bg);color:var(--warn)} .pill.red{background:var(--accent-bg);color:var(--red-ink)} .pill.blue{background:var(--info-bg);color:var(--info)}
.note.blue{background:var(--info-bg)} .note.red{background:var(--accent-bg)}
.note b{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.flow span{padding:4px 9px;border-radius:var(--r-sm);background:var(--tint-04);border:1px solid var(--border)} .flow em{color:var(--ink-4);font-style:normal}
.rhythm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rhythm .r{padding:12px 14px;border-radius:var(--r-md);background:var(--bg-sunken);border:1px solid var(--border)}
.rhythm .r b{display:block;font-family:var(--font-display);font-size:20px;font-weight:500} .rhythm .r span{font-size:12px;color:var(--ink-3)}
.folders{display:flex;flex-wrap:wrap;gap:8px}
.folder{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:var(--r-sm);border:1px dashed var(--border-strong);font-size:12.5px;color:var(--ink-2);text-decoration:none}
.folder.empty{color:var(--ink-4)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--tint-08);color:var(--ink-2);font-weight:600;white-space:nowrap}
.pill.red{background:var(--accent-bg);color:var(--red-ink)} .pill.green{background:var(--success-bg);color:var(--success)} .pill.amber{background:var(--warn-bg);color:var(--warn)} .pill.blue{background:var(--info-bg);color:var(--info)}

/* assessment */
.tabs{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:0;z-index:3;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--border)}
.tab{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-elev);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tab .k{font-family:var(--font-mono);font-size:11px;color:var(--ink-4)}
.tab.active{background:var(--navy);border-color:var(--navy);color:#fff} .tab.active .k{color:rgba(255,255,255,.6)}
.ent-tabs{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.ent-tabs button{height:30px;padding:0 12px;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--bg-elev)}
.ent-tabs button.active{background:var(--tint-08);color:var(--ink)}
.doc-h{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin:28px 0 12px}
.doc-h h2{font-family:var(--font-display);font-weight:500;font-size:20px;margin:0}
.doc-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.basis{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px;color:var(--ink-3)}
.basis .f{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--accent-bg);color:var(--red-ink)}
.basis .src{display:inline-flex;align-items:center;gap:5px}
.basis .src::before{content:"";width:7px;height:7px;border-radius:50%}
.basis .src.doc::before{background:var(--success)} .basis .src.beyan::before{background:var(--warn)} .basis .src.none::before{background:var(--neutral)}
.basis .guide{color:var(--info);text-decoration:none}
.bmc{display:grid;gap:8px;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:auto auto auto}
.bmc .b{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:6px}
.bmc .b h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;display:flex;justify-content:space-between;gap:6px}
.bmc .b h4 i{font-style:normal;font-family:var(--font-mono);color:var(--ink-4);font-weight:400}
.bmc .b ul{margin:0;padding-left:14px;font-size:12.5px;line-height:1.45;color:var(--ink-2)} .bmc .b li{margin:0 0 3px} .bmc .b li b{color:var(--ink);font-weight:600}
.bmc .kp{grid-column:1/3;grid-row:1/3} .bmc .ka{grid-column:3/5;grid-row:1} .bmc .kr{grid-column:3/5;grid-row:2} .bmc .vp{grid-column:5/7;grid-row:1/3;background:var(--navy);color:#fff;border-color:var(--navy)} .bmc .vp h4{color:rgba(255,255,255,.65)} .bmc .vp ul{color:rgba(255,255,255,.85)} .bmc .vp li b{color:#fff} .bmc .cr{grid-column:7/9;grid-row:1} .bmc .ch{grid-column:7/9;grid-row:2} .bmc .cs{grid-column:9/11;grid-row:1/3} .bmc .co{grid-column:1/6;grid-row:3} .bmc .rs{grid-column:6/11;grid-row:3}

<script>
/* =========================================================
   CLIENT CONFIG — her müvekkil için bu blok değişir.
   Durum: done · review (onay bekliyor) · progress · input (girdi bekleniyor – kimden olduğu 'owner' alanında) · pending
   Dayanak: doc (Drive'da doküman var) · beyan (toplantı/soru seti/e-posta beyanı) · none
   ========================================================= */
/*__CLIENT_DATA__*/
const STATUS={done:"Tamamlandı",review:"Onay Bekliyor",progress:"Devam Ediyor",input:"Girdi Bekleniyor",pending:"Başlamadı"};
const CYCLE=["pending","input","progress","review","done"];
const LS="juris-panel:"+CLIENT.id;
let overrides={}; try{overrides=JSON.parse(localStorage.getItem(LS)||"{}");}catch(e){overrides={};}
/* Paylaşımlı durum (v0.4.2): Ana Merkez sunucusunda çalışırken durum çipleri /api/panels/<client>/status ile senkron; file:// ya da sunucusuz açılışta sessizce localStorage'da kalır */
const API=location.protocol.startsWith("http")?"/api/panels/"+encodeURIComponent(CLIENT.id)+"/status":null;
async function syncOverrides(){ if(!API)return; try{ const r=await fetch(API,{credentials:"same-origin"}); if(!r.ok)return; const d=await r.json(); const srv=d.overrides||{};
  const local=Object.keys(overrides); if(!Object.keys(srv).length&&local.length){ await fetch(API+"/bulk",{method:"PUT",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(overrides)}); } /* tek seferlik taşıma: sunucu boş, tarayıcı dolu */
  else { overrides=Object.assign({},overrides,srv); try{localStorage.setItem(LS,JSON.stringify(overrides));}catch(e){} }
  if(typeof render==="function"&&typeof current!=="undefined"){render(); if(typeof renderNav==="function")renderNav();} }catch(e){} }
/* Panel düzenlemeleri (v0.5.5): kullanıcı eklediği aksiyon / karar / toplantı / doküman notu sunucuda (/api/panels/<client>/edits);
   .data.js'e dokunmaz, yeniden taramada / yeniden üretimde korunur. file:// açılışta salt okunur. */
const EAPI=location.protocol.startsWith("http")?"/api/panels/"+encodeURIComponent(CLIENT.id)+"/edits":null;
let EDITS={action:[],decision:[],meeting:[],note:[]};
if(typeof ACTIONS==="undefined")globalThis.ACTIONS=[]; if(typeof DECISIONS==="undefined")globalThis.DECISIONS=[]; if(typeof MEETINGS==="undefined")globalThis.MEETINGS=[];
const PRIO=["Kritik","Yüksek","Orta","Düşük"];
const noteOf=k=>{const n=EDITS.note.find(x=>x.key===k);return n?n.text:"";};
function mergeEdits(){ /* veri dosyasındaki sabit dizilere eklenen kayıtları (işaretli) ekler; tekrar çağrılınca yeniler */
  const strip=a=>{for(let i=a.length-1;i>=0;i--)if(a[i]&&a[i]._ek)a.splice(i,1);};
  strip(ACTIONS);strip(DECISIONS);strip(MEETINGS);
  EDITS.action.forEach(e=>{const r=[e.owner||"—",e.action||"",e.prio||"Orta",e.output||"",e.status||"pending"];r._ek=e.id;ACTIONS.push(r);});
  EDITS.decision.forEach(e=>{const r=[e.topic||"",e.decision||"",e.status||"pending"];r._ek=e.id;DECISIONS.push(r);});
  EDITS.meeting.forEach(e=>{const r={d:e.d||"",t:e.t||"",who:e.who||"",agenda:e.agenda?e.agenda.split(/\s*;\s*/):[],delivered:e.delivered?e.delivered.split(/\s*;\s*/):[],undelivered:e.undelivered?e.undelivered.split(/\s*;\s*/):[],url:e.url||"",st:e.st||"done",_ek:e.id};MEETINGS.push(r);});
  MEETINGS.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
  const n=EDITS.action.length+EDITS.decision.length+EDITS.meeting.length; const c=document.getElementById("procCnt"); if(c)c.textContent=n?"+"+n:""; }
async function syncEdits(){ if(!EAPI)return; try{ const r=await fetch(EAPI,{credentials:"same-origin"}); if(!r.ok)return; const d=await r.json(); EDITS={action:d.action||[],decision:d.decision||[],meeting:d.meeting||[],note:d.note||[]}; mergeEdits(); render(); }catch(e){} }
async function saveEdit(kind,data){ if(!EAPI){alert("Düzenleme için panelin Ana Merkez içinden açılması gerekir.");return;} const r=await fetch(EAPI+"/"+kind,{method:"PUT",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(data)}); if(!r.ok){alert("Kaydedilemedi: "+(await r.text()));return;} await syncEdits(); }
async function delEdit(kind,id){ if(!EAPI)return; await fetch(EAPI+"/"+kind+"/"+encodeURIComponent(id),{method:"DELETE",credentials:"same-origin"}); await syncEdits(); }
const dataDateStr=()=>{const d=(CLIENT.dataDate||(typeof DRIVE_META!=="undefined"&&DRIVE_META.scannedAt)||"").slice(0,10);return d?d.split("-").reverse().join("."):"—";};
let current="home", assessTab="A", assessEnt=CLIENT.short[0];
try{assessTab=localStorage.getItem(LS+":atab")||"A";assessEnt=localStorage.getItem(LS+":aent")||CLIENT.short[0];}catch(e){}
const openSections=new Set(["A","E"]);
const allItems=()=>DATAROOM.flatMap(s=>s.items.map(it=>({...it,section:s})));
const docKey=(it,i)=>it.id+":"+i;
const stOf=(it,i)=>overrides[docKey(it,i)]||it.docs[i].status;
function setStatus(it,i,s){overrides[docKey(it,i)]=s;try{localStorage.setItem(LS,JSON.stringify(overrides));}catch(e){}
  if(API){fetch(API,{method:"PUT",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({key:docKey(it,i),status:s})}).catch(()=>{});}}
function stats(items){const c={done:0,review:0,progress:0,input:0,pending:0,total:0};items.forEach(it=>it.docs.forEach((d,i)=>{c[stOf(it,i)]++;c.total++;}));c.pct=c.total?Math.round(100*(c.done+.5*(c.review+c.progress))/c.total):0;return c;}
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function bar(c){const w=k=>c.total?(100*c[k]/c.total)+"%":"0%";return `<div class="bar"><i class="s-done" style="width:${w("done")}"></i><i class="s-review" style="width:${w("review")}"></i><i class="s-progress" style="width:${w("progress")}"></i><i class="s-input" style="width:${w("input")}"></i></div>`;}
const legend=`<div class="legend"><span><i style="background:var(--success)"></i>Tamamlandı</span><span><i style="background:var(--info)"></i>Onay bekliyor</span><span><i style="background:var(--warn)"></i>Devam ediyor</span><span><i style="background:var(--red-ink)"></i>Girdi bekleniyor</span><span><i style="background:var(--neutral)"></i>Başlamadı</span></div>`;
const li=a=>a.map(x=>`<li>${x}</li>`).join("");
const ghost=(t,cls="")=>`<div class="note ${cls}"><span>▲</span><div>${t}</div></div>`;
const shortTitle=t=>t.replace(/^[A-F][.\-]\d\.?\s*/,"");

function tiles(c){return `<div class="tiles">
  <div class="tile accent"><div class="l">Tamamlanma</div><div class="v num">${c.pct}<small>%</small></div><div style="margin-top:10px">${bar(c)}</div></div>
  <div class="tile"><div class="l">Toplam doküman</div><div class="v num">${c.total}</div><div class="d">${c.done} tamamlandı</div></div>
  <div class="tile"><div class="l">Onay bekliyor</div><div class="v num">${c.review}</div><div class="d">müvekkil yönetimi incelemesinde</div></div>
  <div class="tile"><div class="l">Devam ediyor</div><div class="v num">${c.progress}</div><div class="d">Juris üzerinde</div></div>
  <div class="tile"><div class="l">Girdi bekleniyor</div><div class="v num">${c.input}</div><div class="d">yönetim / mali müşavir / üretim ekibi</div></div>
  <div class="tile"><div class="l">Başlamadı</div><div class="v num">${c.pending}</div><div class="d">planlı</div></div></div>`;}

function docTable(it){return `<div class="tbl-wrap"><table><thead><tr><th>Doküman</th><th>Sorumlu</th><th>Durum</th><th>Drive</th></tr></thead><tbody>
 ${it.docs.map((d,i)=>{const s=stOf(it,i),n=noteOf(docKey(it,i));return `<tr><td class="doc"><span class="no">${esc(d.no)}</span>${esc(d.t)}${d.ent?`<span class="ent">· ${esc(d.ent)}</span>`:""}${n?`<span class="docnote">✎ ${esc(n)}</span>`:""}</td><td class="owner">${esc(d.owner)}</td><td><button class="status ${s}" data-item="${it.id}" data-i="${i}" title="Durumu değiştirmek için tıklayın">${STATUS[s]}</button></td><td style="white-space:nowrap">${d.url?`<a class="linkbtn" href="${d.url}" target="_blank" rel="noopener">Aç ↗</a>`:`<span class="muted">—</span>`}${EAPI?` <button class="linkbtn" data-note="${docKey(it,i)}" title="${n?"Notu düzenle":"Not ekle"}" style="margin-left:8px;color:var(--ink-3)">✎</button>`:""}</td></tr>`;}).join("")}
 </tbody></table></div>`;}
function areaCard(it){const c=stats([it]);return `<button class="card area" data-view="${it.id}"><div class="top"><span class="code">${esc(it.id.replace(/(\D)(\d)/,"$1.$2"))}</span><span class="ttl">${esc(shortTitle(it.title))}</span><span class="pct num">${c.pct}%</span></div>${bar(c)}<div class="foot"><span class="fnchip ${it.fn}">${it.fn}</span><span>${c.done}/${c.total} tamamlandı</span>${c.input?`<span>· ${c.input} girdi</span>`:""}${it.noFolder?`<span>· Drive klasörü yok</span>`:""}</div></button>`;}

/* ---------- views ---------- */
function viewHome(){
  const items=allItems(), c=stats(items);

function viewFn(k){

  ${Object.keys(byArea).map(a=>`<div class="sec"><div class="sec-h"><h2>${esc(a)}</h2><span class="meta">${byArea[a].length} alt başlık</span></div><div class="grid2">${byArea[a].map(areaCard).join("")}</div></div>`).join("")}

}
function viewItem(id){

   <div class="right"><button class="btn" data-view="as-${it.id[0]}">Durum Değerlendirmesi</button>${it.url?`<a class="btn primary" href="${it.url}" target="_blank" rel="noopener">Drive klasörü ↗</a>`:""}</div></div>
  ${tiles(c)}${legend}

   <div class="card pad"><div class="sec-h" style="margin-bottom:10px"><h2 style="font-size:15px">İş akışı</h2></div><div class="flow">${it.flow.map((s,i)=>(i?`<em>→</em>`:"")+`<span>${esc(s)}</span>`).join("")}</div>${it.guide?`<div class="basis" style="margin-top:12px"><span class="pill blue">Rehber</span><span>${esc(it.guide[0])}. ${esc(it.guide[1])}</span>${it.guide[2]?`<a class="guide" href="${it.guide[2]}" target="_blank" rel="noopener">Aç ↗</a>`:`<span class="muted">henüz paylaşılmadı</span>`}</div>`:""}</div>
   <div class="card pad"><div class="sec-h" style="margin-bottom:10px"><h2 style="font-size:15px">Drive yapısı</h2></div>${it.noFolder?`<div class="muted">Data Room'da karşılık gelen klasör henüz açılmadı.</div>`:it.subfolders?`<div class="folders">${it.subfolders.map(s=>`<a class="folder ${s[2]?"empty":""}" href="${s[1]}" target="_blank" rel="noopener">▸ ${esc(s[0])}${s[2]?" · boş":""}</a>`).join("")}</div>`:it.empty?`<div class="muted">Klasör açıldı, henüz doküman yüklenmedi.</div>`:`<div class="muted">Dokümanlar doğrudan klasörde.</div>`}</div>
  </div></div>
  ${it.empty||it.noFolder?ghost(`<b>Bu alt başlıkta henüz çıktı yok.</b> İlk adım: ${esc(it.docs[0].t)} (${esc(it.docs[0].owner)}).`):""}
  <div class="sec"><div class="sec-h"><h2>Dokümanlar</h2><span class="meta">Hizmet planı doküman haritası</span></div><div class="card">${docTable(it)}</div></div>`;

   DURUM DEĞERLENDİRMESİ — ortak yardımcılar (veri müvekkil dosyasında)

const basisLine=(src,extra="")=>`<div class="basis"><span class="src ${src.k}">${src.k==="doc"?"Belge":src.k==="beyan"?"Beyan":"Dayanak yok"}</span>${src.u?`<a class="guide" href="${src.u}" target="_blank" rel="noopener">${esc(src.t)} ↗</a>`:`<span>${esc(src.t)}</span>`}${extra}</div>`;
const docH=(title,fmt,src,status,right="")=>`<div class="doc-h"><div><h2>${title}</h2><div class="basis" style="margin-top:4px"><span class="f">${fmt}</span></div>${basisLine(src)}</div><div class="right"><span class="status ${status}">${STATUS[status]}</span>${right}</div></div>`;
const entTabs=(opts=CLIENT.short)=>opts.length>1?`<div class="ent-tabs">${opts.map(e=>`<button class="${assessEnt===e?"active":""}" data-ent="${e}">${e}</button>`).join("")}</div>`:"";
const blk=(cls,no,title,items)=>`<div class="b ${cls}"><h4>${title}<i>${no}</i></h4><ul>${li(items)}</ul></div>`;
const docbar=(ids)=>{const all=allItems();const out=[];ids.forEach(([itemId,no])=>{const it=all.find(i=>i.id===itemId);if(!it)return;it.docs.forEach((d,i)=>{if(d.no===no&&!out.some(o=>o.t===d.t)){out.push({t:d.t,s:stOf(it,i),no,url:d.url});}});});return `<div class="docbar">${out.map(o=>`<span class="d" title="${esc(o.t)}"><i style="background:${o.s==="done"?"var(--success)":o.s==="review"?"var(--info)":o.s==="progress"?"var(--warn)":o.s==="input"?"var(--red-ink)":"var(--neutral)"}"></i><span class="n">${esc(o.no)}</span>${esc(o.t).slice(0,42)}${o.t.length>42?"…":""}</span>`).join("")}</div>`;};
function canvas(d,lean=false){ if(lean) return `<div class="bmc lean">${blk("pr","1","Problem",d.pr)}${blk("so","4","Çözüm",d.so)}${blk("km","8","Kilit Metrikler",d.km)}${blk("vp","3","Benzersiz Değer Önerisi",d.vp)}${blk("ua","9","Haksız Avantaj",d.ua)}${blk("ch","5","Kanallar",d.ch)}${blk("cs","2","Müşteri Segmentleri",d.cs)}${blk("co","7","Maliyet Yapısı",d.co)}${blk("rs","6","Gelir Akışları",d.rs)}</div>`;
 return `<div class="bmc">${blk("kp","8","Kilit Ortaklıklar",d.kp)}${blk("ka","7","Kilit Faaliyetler",d.ka)}${blk("kr","6","Kilit Kaynaklar",d.kr)}${blk("vp","2","Değer Önerileri",d.vp)}${blk("cr","4","Müşteri İlişkileri",d.cr)}${blk("ch","3","Kanallar",d.ch)}${blk("cs","1","Müşteri Segmentleri",d.cs)}${blk("co","9","Maliyet Yapısı",d.co)}${blk("rs","5","Gelir Akışları",d.rs)}</div>`;}

/* İş Planı – 5 bölüm × OKR (3–5 KR) · kaynak: teklif metodolojisi + 08.09 aksiyonları + 08.10 DD talebi · ilerleme = Juris ön değerlendirmesi */
function okrGrid(list){return `<div class="okr">${list.map(o=>`<div class="o"><h4>${o.t}</h4><div class="obj">${o.o}</div>${o.kr.map(k=>`<div class="kr"><span class="m">${k[0]}</span><span class="tgt">${k[1]}</span><div class="bar"><i class="s-done" style="width:${k[2]}%"></i></div></div>`).join("")}</div>`).join("")}</div>`;}
function barChart(years,vals,ranges,unit){const W=640,H=220,pl=44,pb=34,pt=16,pr=12;const max=Math.max(...vals.filter(v=>v!=null).concat(ranges.filter(Boolean).map(r=>r[1])),10)*1.15;const n=years.length,bw=(W-pl-pr)/n;const y=v=>pt+(H-pt-pb)*(1-v/max);let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Yıllık gelir">`;for(let g=0;g<=4;g++){const v=max*g/4;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`;}years.forEach((yr,i)=>{const cx=pl+bw*i+bw/2;const r=ranges[i],v=vals[i];if(r){s+=`<rect x="${cx-bw*0.3}" y="${y(r[1])}" width="${bw*0.6}" height="${y(r[0])-y(r[1])}" rx="4" fill="var(--tint-12)"><title>${yr}: aralık ${r[0]}–${r[1]} ${unit}</title></rect>`;}if(v!=null){s+=`<rect x="${cx-bw*0.18}" y="${y(v)}" width="${bw*0.36}" height="${Math.max(0,y(0)-y(v))}" rx="3" fill="var(--navy)"><title>${yr}: ${v} ${unit}</title></rect><text x="${cx}" y="${y(v)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${v}</text>`;}else{s+=`<rect x="${cx-bw*0.18}" y="${pt}" width="${bw*0.36}" height="${H-pt-pb}" rx="3" fill="none" stroke="var(--border-strong)" stroke-dasharray="4 3"><title>${yr}: belge bekleniyor</title></rect><text x="${cx}" y="${(H-pb)/2+8}" text-anchor="middle" style="fill:var(--ink-4)">${r?"karar":"belge"}</text>`;}s+=`<text x="${cx}" y="${H-pb+16}" text-anchor="middle">${yr}</text>`;});s+=`<text x="${pl}" y="${H-4}" style="fill:var(--ink-4)">${unit}</text></svg>`;return s;}
const STAGES=["Fikir","Fizibilite","Bütçe","Geliştirme","Lansman","Gelir"];
const stagesEl=s=>`<div class="stages">${STAGES.map((n,i)=>`<span class="${i===s?"on":i<s?"past":""}">${n}</span>`).join("")}</div>`;

/* Hukuk */
function ddList(ent){if(!DD[ent])ent=CLIENT.short[0];let tot=0,ok=0;const html=DD[ent].map(([g,items,who])=>{const rows=items.map(it=>{tot++;const d=DD_DONE[ent].includes(it);if(d)ok++;return `<li class="${d?"ok":""}"><i></i>${esc(it)}</li>`;}).join("");return `<div class="grp"><h5>${esc(g)}<span>${items.filter(i=>DD_DONE[ent].includes(i)).length}/${items.length}</span></h5><div class="muted" style="margin-bottom:4px">Kimden: ${who}</div><ul>${rows}</ul></div>`;}).join("");return {html:`<div class="check">${html}</div>`,tot,ok};}
function ddAll(){return ENTS.reduce((a,e)=>{const r=ddList(e);a.ok+=r.ok;a.tot+=r.tot;return a;},{ok:0,tot:0});}
function heatmap(){let c="";for(let i=5;i>=1;i--){c+=`<div class="ax">Etki ${i}</div>`;for(let p=1;p<=5;p++){const s=p*i,cls=s>=16?"h5":s>=10?"h4":s>=6?"h3":s>=3?"h2":"h1";c+=`<div class="c ${cls}" title="Olasılık ${p} × Etki ${i}">${RISKS.filter(r=>r.p===p&&r.i===i).map(r=>`<span>${r.id}</span>`).join("")}</div>`;}}c+=`<div class="ax"></div>`+[1,2,3,4,5].map(p=>`<div class="ax">Olasılık ${p}</div>`).join("");return `<div class="heat">${c}</div>`;}

/* İletişim */
function assessHead(k){const t=ASSESS_TABS.find(x=>x[0]===k);return `<div class="page-h"><div><div class="eyebrow">Durum Değerlendirmesi · ${k}</div><h1>${t[1]}</h1><p>${t[2]}. Her panel dayandığı belgeyi gösterir; belge yoksa <b>beyan</b> veya <b>iskelet</b> olarak işaretlenir.</p></div></div>
 <div class="tabs">${ASSESS_TABS.map(([kk,tt])=>`<button class="tab ${kk===k?"active":""}" data-view="as-${kk}"><span class="k">${kk}</span>${tt}</button>`).join("")}</div>`;}
function viewAssess(k){return assessHead(k)+({A:assessA,B:assessB,C:assessC,D:assessD,E:assessE,F:assessF}[k])();}
const sec=(h,meta="")=>`<div class="sec-h" style="margin-top:22px"><h2>${h}</h2>${meta?`<span class="meta">${meta}</span>`:""}</div>`;
const lbl=t=>`<div class="label" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600">${t}</div>`;
const LSTAT={applied:["Özümsendi","done"],shared:["Paylaşıldı","review"],planned:["Planlı","pending"]};
function onboardStats(){const obDone=ONBOARD.filter(s=>s[2]).length,obTotal=ONBOARD.length;const lnDone=LEARN.filter(l=>l.st==="applied").length,lnShared=LEARN.filter(l=>l.st==="shared").length,lnTotal=LEARN.length;return {obDone,obTotal,obPct:Math.round(100*obDone/obTotal),lnDone,lnShared,lnTotal,lnPct:Math.round(100*(lnDone+.5*lnShared)/lnTotal)};}
function viewOnboard(){const ob=onboardStats();const lvl=Math.min(5,Math.round(ob.obPct/20));
 return `<div class="page-h"><div><div class="eyebrow">Onboard &amp; Learn</div><h1>Onboarding</h1><p>Müvekkilin hizmet planına alışma yolculuğu. Adımlar tamamlandıkça gelişim seviyesi yükselir.</p></div></div>
 <div class="tiles"><div class="tile accent"><div class="l">Onboarding</div><div class="v num">${ob.obPct}<small>%</small></div><div style="margin-top:10px">${bar({done:ob.obDone,review:0,progress:0,input:0,total:ob.obTotal})}</div></div><div class="tile"><div class="l">Gelişim seviyesi</div><div class="v num">${lvl}<small>/ 5</small></div><div class="lvl" style="margin-top:10px">${[1,2,3,4,5].map(i=>`<div class="${i<=lvl?"on":""}"></div>`).join("")}</div></div><div class="tile"><div class="l">Tamamlanan adım</div><div class="v num">${ob.obDone}<small>/ ${ob.obTotal}</small></div></div><div class="tile"><div class="l">Rehber özümsenme</div><div class="v num">${ob.lnPct}<small>%</small></div><div class="d">${ob.lnDone} özümsendi · ${ob.lnShared} paylaşıldı</div></div></div>
 ${sec("Adımlar")}<div class="card pad"><div class="steps">${ONBOARD.map((s,i)=>`<div class="s ${s[2]?"ok":(i===ONBOARD.findIndex(x=>!x[2])?"cur":"")}"><b>${i+1}. ${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div></div>
 ${sec("Hizmet başlangıcı dokümanları",CLIENT.startLabel||"Hizmet başlangıcı")}<div class="card"><div class="tbl-wrap"><table><thead><tr><th>No</th><th>Doküman</th><th>Tarih</th><th>Durum</th></tr></thead><tbody>${CLIENT.startDocs.map(d=>`<tr><td style="font-family:var(--font-mono);font-size:11px">${d[0]}</td><td><b>${d[1]}</b></td><td class="muted">${d[2]}</td><td><span class="status done">Paylaşıldı</span></td></tr>`).join("")}</tbody></table></div></div>
 ${sec("Çalışma kapsamı","Danışmanlık başlıkları / ayrı şartlara bağlı işler")}<div class="grid2"><div class="card pad">${lbl("Danışmanlık çalışma başlıkları (teklif Mart 2026 · sözleşme 01.04.2026)")}<ul style="margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink-2)">${li(CLIENT.scopeIn)}</ul></div><div class="card pad">${lbl("Ayrı şartlara bağlı / dış paydaş sorumluluğunda")}<ul style="margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink-2)">${li(CLIENT.scopeOut)}</ul></div></div>
 ${sec("Kişiler ve roller","Girdi kimden bekleniyor")}<div class="grid2">${Object.entries(CLIENT.contacts).map(([r,n])=>`<div class="card pad"><div style="display:flex;justify-content:space-between;gap:8px"><b>${r}</b><span class="muted">${n}</span></div><div class="muted" style="margin-top:4px">${allItems().reduce((a,it)=>a+it.docs.filter((d,i)=>stOf(it,i)==="input"&&d.owner.includes(r.split(" ")[0])).length,0)} açık girdi</div></div>`).join("")}</div>`;}
function viewLearn(){const ob=onboardStats();
 return `<div class="page-h"><div><div class="eyebrow">Onboard &amp; Learn</div><h1>Learn – Rehber ve Bilgi Notları</h1><p>Müvekkilin girdisini kolaylaştıran rehber, bilgi notu ve kılavuzlar; paylaşıldıkça ve uygulandıkça gelişim izlenir.</p></div></div>
 <div class="tiles"><div class="tile accent"><div class="l">Özümsenme</div><div class="v num">${ob.lnPct}<small>%</small></div><div style="margin-top:10px">${bar({done:ob.lnDone,review:ob.lnShared,progress:0,input:0,total:ob.lnTotal})}</div></div><div class="tile"><div class="l">Özümsendi</div><div class="v num">${ob.lnDone}</div></div><div class="tile"><div class="l">Paylaşıldı</div><div class="v num">${ob.lnShared}</div></div><div class="tile"><div class="l">Planlı</div><div class="v num">${ob.lnTotal-ob.lnDone-ob.lnShared}</div></div></div>
 ${sec("Rehberler","Her Data Room alt başlığının sayfasında ilgili rehber ayrıca görünür")}<div class="card"><div class="tbl-wrap"><table><thead><tr><th>No</th><th>Rehber / Bilgi Notu</th><th>İlgili bölüm</th><th>Durum</th><th>Drive</th></tr></thead><tbody>${LEARN.map(l=>`<tr><td style="font-family:var(--font-mono);font-size:11px">${l.no}</td><td><b>${l.t}</b></td><td class="muted">${l.for}</td><td><span class="status ${LSTAT[l.st][1]}">${LSTAT[l.st][0]}</span></td><td>${l.url?`<a class="linkbtn" href="${l.url}" target="_blank" rel="noopener">Aç ↗</a>`:`<span class="muted">—</span>`}</td></tr>`).join("")}</tbody></table></div></div>`;}

/* ---------- Insights ---------- */
function hbar(rows,max=100,unit="%"){ return `<div style="display:flex;flex-direction:column;gap:8px">${rows.map(r=>`<div style="display:grid;grid-template-columns:minmax(120px,1fr) 2fr auto;gap:10px;align-items:center;font-size:12.5px"><span style="color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r[0])}">${esc(r[0])}</span><div class="bar" style="height:8px"><i style="width:${Math.min(100,100*r[1]/max)}%;background:${r[2]||"var(--navy)"}"></i></div><span class="num" style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);min-width:48px;text-align:right">${r[3]!=null?r[3]:(Math.round(r[1])+unit)}</span></div>`).join("")}</div>`;}
function stackRow(label,c){return `<div style="display:grid;grid-template-columns:minmax(110px,1fr) 3fr auto;gap:10px;align-items:center;font-size:12.5px"><span style="color:var(--ink-2)">${label}</span>${bar(c)}<span class="num" style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)">${c.done}/${c.total}</span></div>`;}

function viewProcess(){
  const ro=!EAPI; const ek=r=>r._ek?`<span class="ek">eklendi</span>`:"";
  const del=(k,r)=>r._ek&&!ro?`<button class="linkbtn" data-ek-del="${k}:${r._ek}" style="color:var(--ink-3)">sil</button>`:"";
  const stBtn=(r,i)=>r._ek?`<button class="status ${r[4]}" data-ek-status="${r._ek}" data-cur="${r[4]}" title="Durumu değiştir">${STATUS[r[4]]}</button>`:`<span class="status ${r[4]}">${STATUS[r[4]]}</span>`;
  const open=ACTIONS.filter(a=>a[4]!=="done").length, dec=DECISIONS.filter(d=>d[2]!=="done").length;
  return `<div class="page-h"><div><div class="eyebrow">Süreç Kaydı</div><h1>Aksiyon · Karar · Toplantı</h1><p>Hizmet planının süreç katmanı. Veri dosyasındaki kayıtlar + buradan eklenenler (<span class="ek" style="margin:0">eklendi</span>) tek listede; eklenenler sunucuda saklanır, panel yeniden üretildiğinde kaybolmaz. Veri tarihi: <b>${dataDateStr()}</b>.</p></div>
   <div class="right"><span class="pill ${open?"red":"green"}">${open} açık aksiyon</span><span class="pill ${dec?"amber":"green"}">${dec} bekleyen karar</span><span class="pill blue">${MEETINGS.length} toplantı</span></div></div>
  ${ro?ghost("Bu panel Ana Merkez dışında (dosya olarak) açıldı: kayıtlar salt okunur. Eklemek için Ana Merkez → Kurumsal Yönetim Panelleri'nden açın."):""}
  ${sec("Aksiyon Takibi","Sahibi · öncelik · çıktı · durum")}
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Sahibi</th><th>Aksiyon</th><th>Öncelik</th><th>Çıktı</th><th>Durum</th><th></th></tr></thead><tbody>
   ${ACTIONS.map((r,i)=>`<tr><td class="num muted">${i+1}</td><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}${ek(r)}</td><td><span class="pill ${r[2]==="Kritik"?"red":r[2]==="Yüksek"?"amber":""}">${esc(r[2])}</span></td><td style="color:var(--ink-2)">${esc(r[3])}</td><td>${stBtn(r,i)}</td><td>${del("action",r)}</td></tr>`).join("")}
   ${!ACTIONS.length?`<tr><td colspan="7" class="muted">Aksiyon kaydı yok.</td></tr>`:""}</tbody></table></div>
   ${ro?"":`<form class="pform" data-pform="action"><label>Sahibi<input name="owner" required placeholder="Juris · Müvekkil Yönetimi · Mali Müşavir"></label><label style="grid-column:span 2">Aksiyon<input name="action" required placeholder="Ne yapılacak"></label><label>Öncelik<select name="prio">${PRIO.map(p=>`<option${p==="Yüksek"?" selected":""}>${p}</option>`).join("")}</select></label><label>Çıktı<input name="output" placeholder="Belge / karar / toplantı"></label><label>Durum<select name="status">${CYCLE.map(s=>`<option value="${s}">${STATUS[s]}</option>`).join("")}</select></label><button class="btn primary" type="submit">＋ Aksiyon</button></form>`}</div>
  ${sec("Kararlar","Alınan ve bekleyen kararlar")}
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Konu</th><th>Karar</th><th>Durum</th><th></th></tr></thead><tbody>
   ${DECISIONS.map(r=>`<tr><td><b>${esc(r[0])}</b>${ek(r)}</td><td style="color:var(--ink-2)">${esc(r[1])}</td><td><span class="status ${r[2]==="done"?"done":"pending"}">${r[2]==="done"?"Karar alındı":"Karar bekliyor"}</span></td><td>${del("decision",r)}</td></tr>`).join("")}
   ${!DECISIONS.length?`<tr><td colspan="4" class="muted">Karar kaydı yok.</td></tr>`:""}</tbody></table></div>
   ${ro?"":`<form class="pform" data-pform="decision"><label>Konu<input name="topic" required></label><label style="grid-column:span 2">Karar<input name="decision" required placeholder="Alınan karar ya da bekleyen soru"></label><label>Durum<select name="status"><option value="pending">Karar bekliyor</option><option value="done">Karar alındı</option></select></label><button class="btn primary" type="submit">＋ Karar</button></form>`}</div>
  ${sec("Toplantılar","Gündem → tutanak → teslim edilen / edilemeyen")}
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Tarih</th><th>Toplantı</th><th>Katılımcı</th><th>Gündem</th><th>Teslim edilemeyen</th><th>Tutanak</th><th></th></tr></thead><tbody>
   ${MEETINGS.map(m=>`<tr><td class="num" style="font-family:var(--font-mono);font-size:11.5px;white-space:nowrap">${esc(m.d)}</td><td><b>${esc(m.t)}</b>${ek(m)}</td><td class="muted">${esc(m.who)}</td><td style="color:var(--ink-2);font-size:12.5px">${(m.agenda||[]).map(esc).join(" · ")}</td><td style="color:var(--red-ink);font-size:12.5px">${(m.undelivered||[]).map(esc).join(" · ")}</td><td>${m.url?`<a class="linkbtn" href="${esc(m.url)}" target="_blank" rel="noopener">Aç ↗</a>`:`<span class="muted">—</span>`}</td><td>${del("meeting",m)}</td></tr>`).join("")}
   ${!MEETINGS.length?`<tr><td colspan="7" class="muted">Toplantı kaydı yok.</td></tr>`:""}</tbody></table></div>
   ${ro?"":`<form class="pform" data-pform="meeting"><label>Tarih<input name="d" type="date" required></label><label style="grid-column:span 2">Toplantı<input name="t" required placeholder="Aylık yönetim toplantısı"></label><label>Katılımcı<input name="who" placeholder="Müvekkil Yönetimi · Juris"></label><label style="grid-column:span 2">Gündem (; ile ayırın)<input name="agenda"></label><label style="grid-column:span 2">Teslim edilemeyen (; ile)<input name="undelivered"></label><label>Tutanak linki<input name="url" type="url" placeholder="https://docs.google.com/…"></label><button class="btn primary" type="submit">＋ Toplantı</button></form>`}</div>`;
}

/* ---------- router / nav ---------- */
function crumbFor(v){const n=`<b>${esc(CLIENT.name)}</b>`;if(v==="home")return n+" · Genel Bakış";if(v==="insights")return n+" · Genel Bakış · Insights";if(v==="process")return n+" · Süreç Kaydı";if(v.startsWith("fn-"))return n+" · Fonksiyonlar · "+v.slice(3);if(v.startsWith("as-"))return n+" · Durum Değerlendirmesi · "+v.slice(3);if(v==="ob-onboarding")return n+" · Onboard &amp; Learn · Onboarding";if(v==="ob-learn")return n+" · Onboard &amp; Learn · Learn";const it=allItems().find(i=>i.id===v);return it?n+` · Data Room · ${esc(it.section.title)} · ${esc(it.title)}`:n;}
function render(){const v=current,el=document.getElementById("view");
 el.innerHTML=v==="home"?viewHome():v.startsWith("fn-")?viewFn(v.slice(3)):v.startsWith("as-")?viewAssess(v.slice(3)):v==="insights"?viewInsights():v==="process"?viewProcess():v==="ob-onboarding"?viewOnboard():v==="ob-learn"?viewLearn():viewItem(v);
 document.getElementById("crumb").innerHTML=crumbFor(v);renderNav();}
function hashFor(v){return v.startsWith("fn-")?"fn"+FUNCTIONS[v.slice(3)].k:v.replace(/[^\w\-]/g,"");}
function go(v){current=v;try{history.replaceState(null,"","#"+hashFor(v));}catch(e){}render();document.getElementById("main").scrollTop=0;closeNav();}
function renderNav(){const items=allItems();
 document.getElementById("clientBox").innerHTML=`<div class="lbl">Müvekkil</div><div class="cname">${esc(CLIENT.name)}</div><div class="ents">${CLIENT.entities.map(e=>`<span class="ent">${esc(e)}</span>`).join("")}</div>`;
 document.getElementById("fnNav").innerHTML=Object.keys(FUNCTIONS).map(k=>{const c=stats(items.filter(i=>i.fn===k));return `<button class="ni ${current==="fn-"+k?"active":""}" data-view="fn-${k}"><span class="k">${FUNCTIONS[k].k}</span><span class="t">${k}</span><span class="pct num">${c.pct}%</span></button>`;}).join("");
 document.getElementById("asNav").innerHTML=ASSESS_TABS.map(([k,t])=>`<button class="ni ${current==="as-"+k?"active":""}" data-view="as-${k}"><span class="k">${k}</span><span class="t">${t}</span></button>`).join("");
 document.getElementById("drNav").innerHTML=DATAROOM.filter(s=>!s.virtual).map(s=>{const open=openSections.has(s.id)||s.items.some(i=>i.id===current),c=stats(s.items);return `<button class="ni" data-toggle="${s.id}" aria-expanded="${open}"><span class="k">${s.id}</span><span class="t">${esc(s.title.replace(/^[A-F]\.\s*/,""))}</span><span class="pct num">${c.pct}%</span><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button><div class="sub-list ${open?"open":""}">${s.items.map(it=>{const cc=stats([it]),col=cc.pct===100?"var(--success)":cc.pct>0?"var(--warn)":"var(--nav-ink-3)";return `<button class="ni sub ${current===it.id?"active":""}" data-view="${it.id}"><span class="dot" style="background:${col}"></span><span class="t">${esc(shortTitle(it.title))}</span><span class="pct num">${cc.pct}%</span></button>`;}).join("")}</div>`;}).join("");
 const ob=onboardStats();document.getElementById("obNav").innerHTML=`<button class="ni ${current==="ob-onboarding"?"active":""}" data-view="ob-onboarding"><span class="k">OB</span><span class="t">Onboarding</span><span class="pct num">${ob.obPct}%</span></button><button class="ni ${current==="ob-learn"?"active":""}" data-view="ob-learn"><span class="k">LN</span><span class="t">Learn</span><span class="pct num">${ob.lnPct}%</span></button>`;
 document.querySelectorAll('.ni[data-view="home"]').forEach(b=>b.classList.toggle("active",current==="home"));document.querySelectorAll('.ni[data-view="insights"]').forEach(b=>b.classList.toggle("active",current==="insights"));document.querySelectorAll('.ni[data-view="process"]').forEach(b=>b.classList.toggle("active",current==="process"));
 const dd=document.getElementById("dataDate"); if(dd)dd.textContent=dataDateStr();}
document.addEventListener("click",e=>{
 const en=e.target.closest("[data-ent]");if(en){assessEnt=en.dataset.ent;try{localStorage.setItem(LS+":aent",assessEnt);}catch(x){}const y=document.getElementById("main").scrollTop;render();document.getElementById("main").scrollTop=y;return;}
 const v=e.target.closest("[data-view]");if(v){go(v.dataset.view);return;}
 const t=e.target.closest("[data-toggle]");if(t){const id=t.dataset.toggle;openSections.has(id)?openSections.delete(id):openSections.add(id);renderNav();return;}
 const s=e.target.closest("button.status[data-item]");if(s){const it=allItems().find(i=>i.id===s.dataset.item),i=+s.dataset.i,cur=stOf(it,i);setStatus(it,i,CYCLE[(CYCLE.indexOf(cur)+1)%CYCLE.length]);const y=document.getElementById("main").scrollTop;render();document.getElementById("main").scrollTop=y;return;}
 /* Süreç Kaydı düzenlemeleri */
 const es=e.target.closest("[data-ek-status]");if(es){const nx=CYCLE[(CYCLE.indexOf(es.dataset.cur)+1)%CYCLE.length];const rec=EDITS.action.find(x=>x.id===es.dataset.ekStatus)||{};saveEdit("action",{...rec,id:es.dataset.ekStatus,status:nx});return;}
 const ed=e.target.closest("[data-ek-del]");if(ed){if(ed.dataset.arm){const [k,id]=ed.dataset.ekDel.split(/:(.+)/);delEdit(k,id);}else{ed.dataset.arm="1";ed.textContent="Emin misiniz?";setTimeout(()=>{delete ed.dataset.arm;ed.textContent="sil";},2500);}return;}
 const nt=e.target.closest("[data-note]");if(nt){const k=nt.dataset.note;const cur=noteOf(k);const txt=prompt("Doküman notu (boş bırakılırsa silinir):",cur);if(txt===null)return;if(txt.trim())saveEdit("note",{id:k,key:k,text:txt.trim()});else delEdit("note",k);return;}
});
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-pform]");if(!f)return;e.preventDefault();const data={};new FormData(f).forEach((v,k)=>{if(String(v).trim())data[k]=String(v).trim();});saveEdit(f.dataset.pform,data).then(()=>{try{f.reset();}catch(x){}});});
const navEl=document.getElementById("nav"),scrim=document.getElementById("scrim");
function closeNav(){navEl.classList.remove("open");scrim.classList.remove("open");}
document.getElementById("menuBtn").addEventListener("click",()=>{navEl.classList.toggle("open");scrim.classList.toggle("open");});
scrim.addEventListener("click",closeNav);
document.getElementById("today").textContent=new Date().toLocaleDateString("tr-TR",{day:"2-digit",month:"long",year:"numeric"});
const h=(location.hash||"").slice(1);
if(/^fn\d$/.test(h)){const k=Object.keys(FUNCTIONS).find(k=>FUNCTIONS[k].k===h[2]);if(k)current="fn-"+k;}
else if(/^as-[A-F]$/.test(h)||h==="home"||h==="insights"||h==="process"||h==="ob-onboarding"||h==="ob-learn"||allItems().some(i=>i.id===h))current=h;
render();
syncOverrides();
syncEdits();
</script>
